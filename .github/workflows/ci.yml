name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Los tests de integración levantan PostgreSQL con Testcontainers; el runner ya trae Docker.
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npx ng build
      - run: npm audit --audit-level=high

  # Revisa las dependencias que añade o cambia un pull request, del backend y del frontend.
  dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Lo mismo que hace alguien que clona el repositorio: levantarlo todo desde cero y jugar.
  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - name: La web, la API y el registro responden a través de nginx
        run: |
          curl -fsS http://localhost:8081/ | grep -q '<app-root'
          curl -fsS http://localhost:8081/reglas | grep -q '<app-root'
          curl -fsS http://localhost:8081/api/leaderboard | grep -q '"simulado":true'
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"nombre":"ci_jugador","contrasena":"contrasena-de-ci"}' \
            http://localhost:8081/api/auth/register | grep -q '"token"'
      - if: failure()
        run: docker compose logs
