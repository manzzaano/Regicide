# Lo mismo que proxy.conf.json en desarrollo: la web, la API y el WebSocket salen del mismo
# origen, así que el navegador no necesita CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Solo se cargan scripts, estilos, fuentes e imágenes de la propia web, y nadie puede meterla
    # en un iframe. Los estilos en línea hacen falta porque Angular inserta los de cada componente.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # Las rutas de Angular (/partida, /reglas...) devuelven index.html.
        try_files $uri $uri/ /index.html;
    }

    # X-Forwarded-For lleva la IP del jugador al backend, que limita los intentos de login por IP.
    # En producción Caddy lo escribe de cero; sin Caddy delante, un cliente podría inventárselo.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una partida puede quedarse quieta un rato; sin esto nginx corta a los 60 s.
        proxy_read_timeout 1h;
    }
}
