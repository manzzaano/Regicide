# Lo mismo que proxy.conf.json en desarrollo: la web, la API y el WebSocket salen del mismo
# origen, así que el navegador no necesita CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        # Las rutas de Angular (/partida, /reglas...) devuelven index.html.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Una partida puede quedarse quieta un rato; sin esto nginx corta a los 60 s.
        proxy_read_timeout 1h;
    }
}
