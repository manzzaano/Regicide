<a class="saltar visualmente-oculto" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <div class="contenedor barra">
    <a class="marca" routerLink="/">Regicide</a>
    <nav aria-label="Principal">
      <a routerLink="/partida" routerLinkActive="activo" ariaCurrentWhenActive="page">Jugar</a>
      <a routerLink="/reglas" routerLinkActive="activo" ariaCurrentWhenActive="page">Reglas</a>
      <a routerLink="/clasificacion" routerLinkActive="activo" ariaCurrentWhenActive="page">Clasificación</a>
    </nav>
    <div class="cuenta">
      @if (sesion.nombre(); as nombre) {
        <span class="nombre">{{ nombre }}</span>
        <button type="button" class="salir" (click)="sesion.salir()">Salir</button>
      } @else {
        <a routerLink="/entrar" routerLinkActive="activo" ariaCurrentWhenActive="page">Entrar</a>
      }
    </div>
  </div>
</header>

<main id="contenido">
  <router-outlet />
</main>
