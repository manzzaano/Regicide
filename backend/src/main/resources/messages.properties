# Textos para el jugador. Este es el español, el idioma por defecto; messages_en.properties tiene el inglés.
# En los textos con {0}, un apóstrofo se escribe doble ('') porque pasan por MessageFormat.

# Jugadas no válidas (motor)
jugada.terminada=La partida ha terminado
jugada.no-toca-atacar=Ahora no toca atacar
jugada.no-toca-defender=Ahora no toca defenderse
jugada.sin-comodines=No te quedan comodines
jugada.elige-carta=Elige al menos una carta
jugada.carta-repetida=No puedes elegir la misma carta dos veces
jugada.carta-fuera=Esa carta no está en tu mano
jugada.as-con-una=El as solo se puede jugar con una carta más
jugada.combinacion=Combina cartas del mismo número que sumen 10 o menos, o un as con otra carta
jugada.descartar-al-menos=Tienes que descartar al menos {0} puntos

# Partida por WebSocket
partida.inicia-sesion=Inicia sesión para retomar una partida
partida.sin-guardada=No tienes ninguna partida guardada
partida.sin-empezar=No tienes ninguna partida empezada
partida.mensaje-no-valido=Mensaje no válido

# Cuentas
cuenta.falta-nombre=Falta el nombre
cuenta.nombre-formato=El nombre debe tener de 3 a 20 letras, números o guiones bajos
cuenta.nombre-prohibido=Ese nombre no está permitido. Elige otro.
cuenta.nombre-ocupado=Ese nombre ya está en uso
cuenta.correo-no-valido=El correo no es válido
cuenta.credenciales=Nombre o contraseña incorrectos
cuenta.contrasena-actual=La contraseña actual no es correcta
cuenta.enlace-no-valido=El enlace no es válido o ha caducado. Pide otro.
cuenta.demasiados=Demasiados intentos. Espera unos minutos y vuelve a probar.
cuenta.enlace-enviado=Si la cuenta tiene un correo confirmado, te hemos enviado un enlace. Caduca en 30 minutos.
contrasena.falta=Falta la contraseña
contrasena.longitud=La contraseña debe tener de 15 a 128 caracteres
contrasena.es-el-nombre=La contraseña no puede ser tu nombre
contrasena.filtrada=Esa contraseña aparece en filtraciones de datos conocidas; elige otra

# Correos. {0} es el nombre del jugador y {1} el enlace o la dirección de la web.
correo.confirmar.asunto=Confirma tu correo en Regicide
correo.confirmar.texto=Hola, {0}:\n\nPara usar este correo para recuperar la contraseña de tu cuenta, abre este enlace en las próximas 24 horas:\n\n{1}\n\nSolo lo usaremos para eso. Si no has creado tú la cuenta, ignora este mensaje.
correo.restablecer.asunto=Restablece tu contraseña de Regicide
correo.restablecer.texto=Hola, {0}:\n\nPara poner una contraseña nueva, abre este enlace en los próximos 30 minutos:\n\n{1}\n\nSi no lo has pedido tú, ignora este mensaje: tu contraseña no cambia.
correo.contrasena-cambiada.asunto=Tu contraseña de Regicide ha cambiado
correo.contrasena-cambiada.texto=Hola, {0}:\n\nLa contraseña de tu cuenta acaba de cambiar y se han cerrado todas las sesiones. Si no has sido tú, recupérala desde {1} con "¿Has olvidado la contraseña?".
correo.quitado.asunto=Has quitado el correo de tu cuenta de Regicide
correo.cambiado.asunto=El correo de tu cuenta de Regicide ha cambiado
correo.ya-no-sirve.texto=Hola, {0}:\n\nEste correo ya no sirve para recuperar la contraseña de tu cuenta. Si no has sido tú, entra y cambia la contraseña cuanto antes.
