spring.application.name=regicide-backend

# Sin base de datos o sin secreto para firmar los tokens, el backend no arranca
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

regicide.jwt.secreto=${JWT_SECRET}
regicide.jwt.duracion=PT24H

# Orígenes desde los que el navegador puede usar la API y abrir el WebSocket
regicide.origenes-permitidos=http://localhost:4200
