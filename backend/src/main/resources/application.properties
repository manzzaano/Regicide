spring.application.name=regicide-backend

# Sin base de datos o sin secreto para firmar los tokens, el backend no arranca
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Textos en español salvo que la petición pida inglés (Accept-Language); nunca el idioma del sistema
spring.web.locale=es
spring.messages.fallback-to-system-locale=false

regicide.jwt.secreto=${JWT_SECRET}
regicide.jwt.duracion=PT24H

# Orígenes desde los que el navegador puede usar la API y abrir el WebSocket
regicide.origenes-permitidos=http://localhost:4200

# Detrás de Caddy y nginx, la IP del jugador llega en X-Forwarded-For
server.forward-headers-strategy=native

# Correos para recuperar la contraseña. Sin RESEND_API_KEY no se envían.
regicide.correo.resend-api-key=${RESEND_API_KEY:}
regicide.correo.remitente=Regicide <noreply@leosoftware.dev>
# Base de los enlaces de los correos
regicide.url-publica=http://localhost:4200

# Fallos de login o de recuperación y registros por IP cada 15 minutos
regicide.intentos.por-ip=30
